services:
  db:
    image: postgres:16-alpine
    container_name: rickhouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rickhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rickhouse}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    # Deliberately not published to the host: only `app` needs to reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rickhouse} -d ${POSTGRES_DB:-rickhouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    # Prebuilt by .github/workflows/publish.yml and pulled from GHCR, so your
    # server never compiles Next.js. To build from source instead, add the
    # override: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ${RICKHOUSE_IMAGE:-ghcr.io/zacharywelker/rickhouse}:${RICKHOUSE_TAG:-latest}
    container_name: rickhouse-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rickhouse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rickhouse}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/New_York}
    ports:
      - "${APP_PORT:-1964}:1964"
    volumes:
      - ${UPLOADS_PATH:-./data/uploads}:/data/uploads
      # Automated in-app backups (Admin -> Backups) write here. Point this at
      # a share that is actually part of your parity/backup plan, the same
      # way scripts/backup.sh's BACKUP_DIR should be.
      - ${BACKUP_PATH:-./data/backups}:/data/backups
    labels:
      # Unraid substitutes [IP] and [PORT:nnnn], turning the container's entry
      # in the Docker tab into a working WebUI link. Harmless elsewhere.
      net.unraid.docker.webui: "http://[IP]:[PORT:1964]"
      net.unraid.docker.shell: "sh"
