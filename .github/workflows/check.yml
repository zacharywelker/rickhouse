name: Check

# Lint, type-check and unit tests on every pull request, so a broken script or
# a tooling upgrade fails here instead of on the next person to run it. The
# image build in publish.yml already covers `next build`; the Playwright suite
# needs Postgres and stays a local run.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the node:22-alpine base in the Dockerfile.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
