name: Rickhouse
options:
  bundleIdPrefix: com.zacharywelker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rickhouse:
    type: application
    platform: iOS
    sources: [Rickhouse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharywelker.rickhouse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Rickhouse
        INFOPLIST_KEY_NSCameraUsageDescription: Rickhouse uses the camera to photograph your bottles and labels.
      # Release is HTTPS only, enforced in Session.normalise (generated
      # Info.plists can't carry an ATS dictionary). Debug may use a LAN dev server.
      configs:
        Debug:
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: Rickhouse connects to a development server on the local network.
