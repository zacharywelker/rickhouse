# Build the app image locally instead of pulling it from GHCR.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Use this for development, or on a server you would rather keep off the
# registry. The plain `docker compose up -d` path pulls the published image.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
