name: CodeQL

# Advanced setup (replaces the default setup, which can't build the iOS app:
# ios/Rickhouse.xcodeproj is generated from ios/project.yml and not committed).
# Turn off "Default setup" under Settings > Code security, or the two will
# upload conflicting results.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Swift scan takes ~25 minutes, so on a PR it only runs when the PR
  # touches iOS code (or this workflow). Pushes to main, the weekly schedule
  # and manual runs always scan everything.
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Compare with the base branch
        id: diff
        run: |
          js='{"language":"javascript-typescript","runner":"ubuntu-latest","build-mode":"none"}'
          swift='{"language":"swift","runner":"macos-26","build-mode":"manual"}'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            include="$js,$swift"
          # On a PR the checkout is a merge commit; HEAD^1 is the base branch tip.
          elif git diff --name-only HEAD^1 HEAD | grep -q -E '^(ios/|\.github/workflows/codeql\.yml$)'; then
            include="$js,$swift"
          else
            include="$js"
          fi
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Before Initialize CodeQL on purpose: init turns on the build tracer for
      # every later step, and the tracer makes brew run under Rosetta and fail.
      - name: Generate the Xcode project
        if: matrix.language == 'swift'
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Must compile every Swift file: CodeQL only sees what the compiler
      # runs on, so no build caches, and signing is off (no certificates here).
      - name: Build iOS app
        if: matrix.language == 'swift'
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project Rickhouse.xcodeproj \
            -scheme Rickhouse \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          category: "/language:${{ matrix.language }}"
