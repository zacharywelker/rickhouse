name: Rickhouse
options:
  bundleIdPrefix: com.zacharywelker
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rickhouse:
    type: application
    platform: iOS
    sources: [Rickhouse]
    # The launch screen is the app's ivory paper (#FFF8E7, the LaunchBackground color in Assets.xcassets), so there is no
    # white or black flash before the first screen. A generated Info.plist can't name the color, so this one key lives here;
    # everything else is still generated from the INFOPLIST_KEY settings below.
    info:
      path: Rickhouse/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharywelker.rickhouse
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Rickhouse
        INFOPLIST_KEY_NSCameraUsageDescription: Rickhouse uses the camera to photograph your bottles and labels, and to scan their barcodes.
      # Release is HTTPS only, enforced in Session.normalise (generated
      # Info.plists can't carry an ATS dictionary). Debug may use a LAN dev server.
      configs:
        Debug:
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: Rickhouse connects to a development server on the local network.
