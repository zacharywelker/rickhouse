name: Publish image

# Builds the app image and pushes it to GitHub Container Registry, so Unraid
# can pull a tag instead of compiling Next.js on your server.
#
# Pull requests build but do not push: that catches a broken Dockerfile or a
# type error before it reaches `latest`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/<repo>, lowercased for us.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Rickhouse
            org.opencontainers.image.description=A bottle tracker for whiskey, rum, and spirits of all types.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Unraid is x86-64. Adding arm64 roughly triples the build for no
          # one's benefit; add it here if that ever changes.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain image manifest rather than an attestation index: some
          # registries and older Docker clients handle it more predictably.
          provenance: false

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed to GHCR"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "On Unraid: \`docker compose pull && docker compose up -d\`"
          } >> "$GITHUB_STEP_SUMMARY"
